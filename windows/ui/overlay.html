<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Fasty overlay</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="common.css">
<script>window.__noFwd = true; /* browser shortcuts must not act on the page behind the glass */</script>
<style>
html,body{height:100%;overflow:hidden;background:var(--frame);user-select:none;-webkit-user-select:none}
/* A snapshot of the window behind, blurred; the glass cards blur it again, which reads as one see-through sheet. */
#bg{position:fixed;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(26px) saturate(1.35) brightness(.96);transform:scale(1.02)}
#scrim{position:fixed;inset:0;background:rgba(255,255,255,.22)}
:root[data-theme=dark] #scrim{background:rgba(0,0,0,.42)}
[hidden]{display:none!important}
.glass{position:fixed;background:rgba(255,255,255,.58);-webkit-backdrop-filter:blur(36px) saturate(1.9);backdrop-filter:blur(36px) saturate(1.9);border:1px solid rgba(255,255,255,.62);border-top-color:rgba(255,255,255,.9);border-radius:20px;color:var(--ink)}
:root[data-theme=dark] .glass{background:rgba(32,32,32,.56);border-color:rgba(255,255,255,.10);border-top-color:rgba(255,255,255,.2)}
.fade{animation:in .16s ease-out both}
@keyframes in{from{opacity:0;transform:translateX(-50%) translateY(-6px) scale(.985)}to{opacity:1;transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.fade,#dlg.fade{animation:none}}

/* ---- Spotlight ---- */
#spot{left:50%;top:15vh;transform:translateX(-50%);width:min(680px,92vw);padding:8px;max-height:72vh;display:flex;flex-direction:column}
.entry{display:flex;align-items:center;gap:8px;min-height:52px;padding:0 6px 0 12px}
.entry .lead{color:var(--muted);flex:none}
.private .entry .lead,.private .chip{color:var(--private)}
.chip{font-size:11.5px;color:var(--muted);border:1px solid var(--hairline);border-radius:999px;padding:2px 9px;white-space:nowrap;flex:none}
.entry input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1.35em;outline:0;height:48px;user-select:text;-webkit-user-select:text}
.entry input::placeholder{color:var(--muted)}
.entry .mic{width:38px;height:38px;border-radius:11px;color:var(--muted);display:grid;place-items:center;flex:none}
.entry .mic:hover,.entry .mic.on{background:rgba(127,127,127,.18);color:var(--ink)}
.sep{height:1px;background:rgba(127,127,127,.28);margin:6px 6px}
.sugs{list-style:none;margin:0;padding:0;overflow:auto}
.sug{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 12px;border-radius:12px;cursor:default}
.sug.sel{background:rgba(127,127,127,.2)}
.sug .ic{color:var(--muted);flex:none;width:18px}
.sug .t{min-width:0;flex:1}
.sug .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug .t small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug .k{font-size:11.5px;color:var(--muted)}
.hint{color:var(--muted);font-size:12.5px;padding:10px 14px 6px}
#voice{padding:6px 4px 4px}

/* ---- Settings dialog ---- */
#dlg{left:50%;top:50%;transform:translate(-50%,-50%);width:min(900px,94vw);height:min(640px,88vh);display:grid;grid-template-columns:210px 1fr;overflow:hidden;padding:0}
#dlg.fade{animation:inc .18s ease-out both}
@keyframes inc{from{opacity:0;transform:translate(-50%,-48%) scale(.985)}to{opacity:1;transform:translate(-50%,-50%)}}
@media (prefers-reduced-motion:reduce){#dlg.fade{animation:none}}
.nav{padding:18px 10px;border-right:1px solid rgba(127,127,127,.25);display:flex;flex-direction:column;gap:2px}
.nav h2{margin:0 10px 12px;font-size:15px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink)}
.nav button{text-align:left;padding:8px 12px;border-radius:10px;color:var(--ink)}
.nav button:hover{background:rgba(127,127,127,.16)}
.nav button.on{background:rgba(127,127,127,.26);font-weight:600}
.body{overflow:auto;padding:8px 26px 28px;position:relative}
.xbtn{position:absolute;right:12px;top:10px;width:32px;height:32px;border-radius:9px;color:var(--muted);display:grid;place-items:center}
.xbtn:hover{background:rgba(127,127,127,.2);color:var(--ink)}
.body h1{font-size:22px;margin:16px 0 0}
.grp{margin:22px 0 0}
.grp>h3{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px 2px}
.card2{border-radius:14px;background:rgba(127,127,127,.14);padding:2px 14px}
.r{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid rgba(127,127,127,.22)}
.r:last-child{border-bottom:0}
.r .g{flex:1;min-width:0}
.r small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.r input[type=text],.r input[type=number],.r select{height:34px;border:1px solid rgba(127,127,127,.35);border-radius:9px;padding:0 10px;background:rgba(255,255,255,.5);color:var(--ink);font:inherit;min-width:170px;user-select:text;-webkit-user-select:text}
:root[data-theme=dark] .r input[type=text],:root[data-theme=dark] .r input[type=number],:root[data-theme=dark] .r select{background:rgba(0,0,0,.25)}
.r input[type=number]{min-width:90px;width:96px}
.r button.b{height:34px;padding:0 14px;border-radius:9px;background:rgba(127,127,127,.24);font-weight:500;white-space:nowrap}
.r button.b:hover{background:rgba(127,127,127,.36)}
.r button.b.danger{color:var(--danger)}
.r input[type=checkbox]{background:rgba(127,127,127,.45)}
.r input[type=checkbox]:checked{background:var(--accent)}
.note{color:var(--muted);font-size:12.5px;padding:10px 2px}
.lic{font-size:13px}
@media (max-width:640px){#dlg{grid-template-columns:1fr}.nav{flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid rgba(127,127,127,.25);padding:8px}.nav h2{display:none}}
</style></head>
<body>
<img id="bg" alt="" hidden>
<div id="scrim"></div>

<section id="spot" class="glass fade" hidden role="dialog" aria-modal="true" aria-label="Search">
  <form class="entry" id="form" autocomplete="off" role="search">
    <span class="lead" id="lead"></span>
    <input id="q" type="text" spellcheck="false" placeholder="Search or enter an address" aria-label="Search or enter an address" aria-controls="sugs" aria-autocomplete="list">
    <span class="chip" id="chip"></span>
    <button type="button" class="mic" id="mic" title="Voice search" aria-label="Voice search"></button>
  </form>
  <div id="voice" hidden></div>
  <div id="sepwrap" hidden><div class="sep"></div><ul class="sugs" id="sugs" role="listbox"></ul></div>
  <p class="hint" id="hint"></p>
</section>

<section id="dlg" class="glass fade" hidden role="dialog" aria-modal="true" aria-labelledby="dlgtitle">
  <nav class="nav" aria-label="Settings sections"><h2 id="dlgtitle">Settings</h2>
    <button data-s="general" class="on">General</button><button data-s="privacy">Privacy</button><button data-s="oss">Open Source</button><button data-s="about">About</button></nav>
  <div class="body" id="body"><button class="xbtn" id="x" title="Close (Esc)" aria-label="Close settings"></button><div id="content"></div></div>
</section>

<script src="common.js"></script>
<script src="voice.js"></script>
<script>
const $ = id => document.getElementById(id);
const post = o => window.fastyPost(o);
let mode = '', priv = false, sugs = [], sel = -1, timer = 0, voiceOn = false, dark = false;
const hide = () => post({ a: 'close' });
$('x').innerHTML = icon.x; $('mic').innerHTML = icon.mic;

window.fastyOverlay = p => {
  document.documentElement.dataset.theme = p.theme || document.documentElement.dataset.theme; dark = document.documentElement.dataset.theme === 'dark';
  if (p.bg) { $('bg').src = p.bg; $('bg').hidden = false; }
  $('spot').hidden = $('dlg').hidden = true;
  mode = p.mode; priv = !!p.private;
  if (mode === 'settings') openSettings(p.section || 'general'); else openSpot(p);
};
window.fastyOverlayHide = () => { stopVoice(); $('spot').hidden = $('dlg').hidden = true; $('bg').hidden = true; $('bg').removeAttribute('src'); };

/* ---------- Spotlight ---------- */
const CHIP = { newtab: 'New tab', address: 'This tab', switch: 'Switch tab' };
function openSpot(p) {
  const s = $('spot'); s.hidden = false; s.classList.remove('fade'); void s.offsetWidth; s.classList.add('fade');
  s.classList.toggle('private', priv);
  $('lead').innerHTML = mode === 'switch' ? icon.tab : icon.search;
  $('chip').textContent = priv && mode === 'newtab' ? 'Private tab' : (CHIP[mode] || '');
  $('q').placeholder = mode === 'switch' ? 'Switch to a tab' : 'Search or enter an address';
  $('q').value = p.url || ''; sugs = []; sel = -1; draw(); stopVoice();
  $('hint').textContent = mode === 'newtab' ? 'Enter opens it in a new tab. Esc to cancel.' : mode === 'switch' ? 'Pick one of your open tabs.' : 'Enter opens it in this tab. Esc to cancel.';
  $('q').focus(); $('q').select();
  if (mode === 'switch') suggest();
  if (p.voice) startVoice();
}
function draw() {
  const ul = $('sugs'); ul.textContent = ''; $('sepwrap').hidden = !sugs.length || voiceOn;
  sugs.forEach((s, i) => {
    const li = document.createElement('li'); li.className = 'sug' + (i === sel ? ' sel' : ''); li.setAttribute('role', 'option');
    const ic = s.kind === 'search' ? icon.search : s.kind === 'bookmark' ? icon.star : s.kind === 'history' ? icon.clock : s.kind === 'tab' ? icon.tab : icon.globe;
    li.innerHTML = '<span class="ic">' + ic + '</span><span class="t"><b></b><small></small></span><span class="k"></span>';
    li.querySelector('b').textContent = s.kind === 'search' ? s.title : (s.title || s.url);
    li.querySelector('small').textContent = s.kind === 'search' ? 'Search' : s.url.replace(/^https?:\/\//, '');
    li.querySelector('.k').textContent = s.kind === 'tab' && mode !== 'switch' ? 'Switch to tab' : '';
    li.onmousedown = e => { e.preventDefault(); go(s); };
    ul.appendChild(li);
  });
  const cur = ul.children[sel]; if (cur) cur.scrollIntoView({ block: 'nearest' });
}
function go(s) {
  const text = typeof s === 'string' ? s : s.url;
  if (!text || !text.trim()) return;
  if (typeof s !== 'string' && s.kind === 'tab') { rpc('nav', { v: s.url, mode: 'switch' }); return; }
  rpc('nav', { v: text, mode, private: priv });
}
async function suggest() {
  const q = $('q').value; if (!q.trim() && mode !== 'switch') { sugs = []; sel = -1; draw(); return; }
  const r = await rpc('suggest', { q, mode: mode === 'switch' ? 'switch' : '' });
  if ($('q').value === q) { sugs = r || []; sel = sugs.length ? 0 : -1; draw(); }
}
$('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(suggest, 40); });
$('q').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' && sugs.length) { e.preventDefault(); sel = (sel + 1) % sugs.length; draw(); }
  else if (e.key === 'ArrowUp' && sugs.length) { e.preventDefault(); sel = (sel - 1 + sugs.length) % sugs.length; draw(); }
});
$('form').addEventListener('submit', e => { e.preventDefault(); if (sel >= 0 && sugs[sel] && $('q').value.trim()) go(sugs[sel]); else if (mode === 'switch' && sugs[0]) go(sugs[0]); else go($('q').value); });
$('mic').onclick = () => voiceOn ? stopVoice() : startVoice();
function startVoice() {
  if (!window.FastyVoice) return;
  voiceOn = true; $('mic').classList.add('on'); $('voice').hidden = false; $('sepwrap').hidden = true; $('hint').textContent = '';
  const box = $('voice'); box.textContent = '';
  FastyVoice.mount(box, { auto: true, dark, onSubmit: t => { stopVoice(); go(t); }, onCancel: () => { stopVoice(); $('q').focus(); } });
}
function stopVoice() { if (!voiceOn) return; voiceOn = false; $('mic').classList.remove('on'); $('voice').hidden = true; try { FastyVoice.close(); } catch (e) {} draw(); }
if (new URLSearchParams(location.search).get('selftest') === '1') {
  new MutationObserver(() => { const l = document.querySelector('#voice [role=log]'); if (l) post({ a: 'rpc', id: 0, m: 'selftest.flag', p: { k: 'voice-text', v: l.textContent } }); }).observe($('voice'), { childList: true, subtree: true, characterData: true });
}

/* ---------- Settings dialog ---------- */
const LIC = [
  ['Fasty for Windows', 'MIT', 'FastHand Studio'], ['Microsoft Edge WebView2', 'Microsoft (not redistributed)', 'Draws web pages'],
  ['go-webview2 (patched copy)', 'MIT', 'github.com/wailsapp/go-webview2'], ['Go and its standard library', 'BSD-3-Clause', 'The language and runtime'],
  ['golang.org/x/sys', 'BSD-3-Clause', 'Windows system calls'], ['React and ReactDOM', 'MIT', 'Voice screen'],
  ['Dictation Dune', 'by Louis Studios', 'Voice search animation'], ['reader.js (reading mode)', 'MIT', 'From Fasty for Linux'],
  ['StevenBlack hosts', 'MIT', 'Optional extended Shield list, downloaded weekly'], ['Inno Setup', 'Inno Setup license', 'Builds the installer']
];
let S = {}, A = {}, section = 'general';
function openSettings(sec) {
  const d = $('dlg'); d.hidden = false; d.classList.remove('fade'); void d.offsetWidth; d.classList.add('fade');
  Promise.all([rpc('settings.get'), rpc('app.state')]).then(([s, a]) => { S = s; A = a; show(sec); });
}
document.querySelectorAll('.nav button').forEach(b => b.onclick = () => show(b.dataset.s));
$('x').onclick = hide;
function el(h) { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; }
function save(k, v) { S[k] = v; return rpc('settings.set', S).then(s => { S = s; }); }
function row(title, sub, control) { const r = el('<div class="r"><div class="g"></div></div>'); r.firstChild.innerHTML = '<span></span><small></small>'; r.firstChild.firstChild.textContent = title; r.firstChild.lastChild.textContent = sub || ''; if (!sub) r.firstChild.lastChild.remove(); if (control) r.appendChild(control); return r; }
function sw(k) { const c = el('<input type="checkbox">'); c.checked = !!S[k]; c.onchange = () => save(k, c.checked); return c; }
function selectCtl(k, opts) { const s = el('<select></select>'); for (const [v, n] of opts) { const o = document.createElement('option'); o.value = v; o.textContent = n; s.appendChild(o); } s.value = S[k]; s.onchange = () => save(k, s.value).then(() => { if (k === 'searchEngine') custom.style.display = s.value === 'custom' ? '' : 'none'; }); return s; }
function numCtl(k, min, max, step) { const n = el('<input type="number">'); n.min = min; n.max = max; n.step = step || 1; n.value = S[k]; n.onchange = () => save(k, Math.max(min, Math.min(max, parseInt(n.value || '0', 10) || 0))); return n; }
function btn(text, fn, danger) { const b = el('<button class="b" type="button"></button>'); b.textContent = text; if (danger) b.classList.add('danger'); b.onclick = () => fn(b); return b; }
function grp(title, rows) { const g = el('<div class="grp"><h3></h3><div class="card2"></div></div>'); g.firstChild.textContent = title; rows.forEach(r => g.lastChild.appendChild(r)); return g; }
let custom = null;
function show(sec) {
  section = sec; document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.dataset.s === sec));
  const c = $('content'); c.textContent = ''; const h = document.createElement('h1'); h.textContent = { general: 'General', privacy: 'Privacy', oss: 'Open Source', about: 'About' }[sec]; c.appendChild(h);
  if (sec === 'general') general(c); else if (sec === 'privacy') privacy(c); else if (sec === 'oss') oss(c); else about(c);
  $('body').scrollTop = 0;
}
function general(c) {
  const eng = selectCtl('searchEngine', [...(A.engines || []).map(e => [e.Key, e.Name]), ['custom', 'Custom address']]);
  const ci = el('<input type="text" placeholder="https://example.com/?q=%s">'); ci.value = S.customEngine || ''; ci.onchange = () => save('customEngine', ci.value.trim()).then(() => { ci.value = S.customEngine || ''; eng.value = S.searchEngine; });
  custom = row('Custom search address (%s for the words)', 'Used when the search engine is Custom', ci); custom.style.display = S.searchEngine === 'custom' ? '' : 'none';
  const side = selectCtl('tabsSide', [['left', 'Down the left'], ['top', 'Across the top']]);
  const w = el('<input type="range" min="180" max="420" step="4">'); w.value = S.sidebarWidth; w.oninput = () => save('sidebarWidth', parseInt(w.value, 10));
  c.appendChild(grp('Searching', [row('Search engine', 'Used for anything typed that isn\'t an address', eng), custom]));
  c.appendChild(grp('Appearance', [row('Appearance', 'Follow Windows, or choose', selectCtl('appearance', [['system', 'System'], ['light', 'Light'], ['dark', 'Dark']])),
    row('Tabs', 'Down the left, or across the top (Ctrl+Shift+S)', side), row('Sidebar width', 'Or drag the edge of the sidebar', w), row('Page zoom (%)', 'Default size of pages. Ctrl+ + and Ctrl+ - still zoom one site', numCtl('pageZoom', 50, 300, 10))]));
  const dflt = btn('Make Fasty the default', () => rpc('defaultbrowser'));
  c.appendChild(grp('Starting up and speed', [row('Restore tabs on start', 'Reopen the tabs you had open', sw('restoreSession')),
    row('Put unused tabs to sleep after (minutes)', 'Frees their memory, and the page reloads when you come back. 0 never sleeps them', numCtl('sleepMinutes', 0, 1440)),
    row('Smooth scrolling', 'Takes effect next launch', sw('smoothScroll')), row('Hardware acceleration', 'Draws pages with the graphics card. Takes effect next launch', sw('hardwareAccel')),
    row('Default browser', 'Open links from other apps in Fasty. Windows asks you to choose', dflt)]));
  c.appendChild(grp('Downloads', [row('Save files to', A.downloads || '', btn('Open folder', () => rpc('downloads')))]));
}
function privacy(c) {
  c.appendChild(grp('Blocking', [row('Shield', 'Blocks requests to known ad and tracker hosts', sw('shield')), row('Extended list', 'Also use the StevenBlack hosts list, downloaded once a week from GitHub. Takes effect next launch', sw('extendedShield')),
    row('Clean links', 'Remove tracking parameters (utm_*, fbclid, gclid ...) from addresses you open or copy', sw('cleanLinks'))]));
  const off = (S.shieldPaused || []).map(h => row(h, 'Shield is off here', btn('Turn on', async () => { S.shieldPaused = await rpc('shield.resume', { host: h }); show('privacy'); })));
  c.appendChild(off.length ? grp('Blocker is off on', off) : grp('Blocker is off on', [row('No sites', 'Use Menu, Pause Shield on this site, to switch it off for a site that breaks')]));
  const hid = (A.hidden || []).map(s => row(s.host, s.count + ' hidden', btn('Show again', async () => { A.hidden = await rpc('veils.show', { host: s.host }); show('privacy'); })));
  c.appendChild(hid.length ? grp('Hidden elements', hid) : grp('Hidden elements', [row('Nothing hidden', 'Use Menu, Hide Something (Ctrl+Shift+H), then click what to hide')]));
  const file = el('<input type="file" accept=".html,.htm" hidden>'); const msg = el('<span class="note"></span>');
  file.onchange = async () => { const f = file.files[0]; if (!f) return; if (f.size > 8e6) { msg.textContent = 'That file is too big.'; return; } const r = await rpc('bookmarks.import', { html: await f.text() }); msg.textContent = r.added + ' added, ' + r.total + ' bookmarks now.'; };
  const clear = btn('Clear everything', async b => { if (!confirm('Clear history, cookies, site data and cache? Bookmarks stay.')) return; const r = await rpc('data.clear'); if (r && r.restart) { b.disabled = true; if (confirm('History is cleared. Cookies and cache are removed when Fasty restarts. Restart now?')) rpc('app.restart'); } }, true);
  c.appendChild(grp('Browsing data', [row('Clear everything', 'History, cookies, site data and cache. Bookmarks stay.', clear),
    row('Import bookmarks', 'From an HTML bookmarks file (Chrome, Edge, Firefox...)', (() => { const w = document.createElement('span'); w.append(btn('Choose file...', () => file.click()), file, msg); return w; })())]));
}
function oss(c) { c.appendChild(grp('Open source licenses', LIC.map(([n, l, d]) => row(n, l + ' · ' + d)))); const p = el('<p class="note lic">Fasty for Windows is MIT licensed. Full texts are in the licenses folder next to fasty.exe and in the repository.</p>'); c.appendChild(p); }
function about(c) {
  c.appendChild(grp('Fasty for Windows', [row('Version', A.version || ''), row('Pages are drawn by', 'Microsoft Edge WebView2 (Chromium)'), row('Voice search', 'Uses the speech recognizer that ships with Windows, on this PC. No audio or text leaves it.'),
    row('Source and releases', 'github.com/fasthand-studio/FastyBrowser'), row('Keyboard shortcuts', 'The same keys as Fasty on Linux', btn('Show', () => rpc('openpage', { name: 'shortcuts.html' })))]));
}

/* ---------- common ---------- */
addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); if (voiceOn) { stopVoice(); $('q').focus(); } else hide(); } });
$('scrim').addEventListener('mousedown', hide); $('bg').addEventListener('mousedown', hide);
</script></body></html>
